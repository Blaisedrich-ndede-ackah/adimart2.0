<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" />
  <style>
    body {
      margin: 0;
      background: #f2f2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .container { text-align: center; padding: 24px; }
    .icon {
      width: 96px;
      height: 96px;
      background: #fff;
      border-radius: 22px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 0.5px rgba(60, 60, 67, 0.12), 0 12px 32px rgba(0, 0, 0, 0.08);
    }
    .icon svg { width: 52px; height: 52px; }
    h1 {
      color: #1c1c1e;
      font-size: 28px;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    p { color: #636366; font-size: 15px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#065f46" stroke-width="2">
        <circle cx="9" cy="21" r="1"/>
        <circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
    </div>
    <h1>Adimat</h1>
    <p>Loading…</p>
  </div>
</body>
</html>
